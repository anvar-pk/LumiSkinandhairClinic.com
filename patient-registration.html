<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Registration | Dr. Shifa's Lumi Skin &amp; Hair Clinic</title>
<link rel="icon" type="image/png" sizes="256x256" href="favicon.png?v=2">
<link rel="shortcut icon" href="favicon.ico?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root { --primary:#8B4513; --accent:#C17F59; --cream:#F5EDE3; --text:#3D2914; --text-light:#7A5C3C; --white:#fff; }
* { box-sizing:border-box; }
body { margin:0; font-family:'Inter',sans-serif; color:var(--text); line-height:1.6; background:var(--cream); }
h1 { font-family:'Playfair Display',serif; }
.site-header { background:rgba(245,237,227,.98); box-shadow:0 2px 20px rgba(139,69,19,.08); }
.header-inner { max-width:1200px; margin:0 auto; padding:1rem 2rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; }
.brand { display:inline-flex; align-items:center; text-decoration:none; }
.brand-logo { display:block; width:auto; height:62px; max-width:min(50vw,260px); object-fit:contain; }
.back-link,.home-button { display:inline-block; color:var(--white); background:var(--primary); border:1px solid var(--primary); border-radius:999px; padding:.7rem 1.2rem; font-weight:600; text-decoration:none; transition:background .2s,color .2s; }
.back-link:hover,.home-button:hover { color:var(--primary); background:transparent; }
main { max-width:1000px; margin:0 auto; padding:3rem 2rem 4rem; }
.intro { text-align:center; margin-bottom:2rem; }
.intro h1 { color:var(--primary); font-size:clamp(2rem,5vw,2.8rem); margin:0 0 .5rem; }
.intro p { color:var(--text-light); margin:0 auto; max-width:650px; }
.form-card { background:var(--white); border-radius:20px; overflow:hidden; box-shadow:0 10px 40px rgba(139,69,19,.1); }
@keyframes lumi-float {
  0%, 100% { transform:translateY(0); }
  50% { transform:translateY(-15px); }
}
.registration-form-logo {
 display:block;
 width:min(95%,420px);
 height:auto;
 margin:0 auto 1.5rem;
 filter:drop-shadow(0 15px 40px rgba(139,69,19,.2));
 border-radius:16px;
 animation:lumi-float 3s ease-in-out infinite;
}
@media(prefers-reduced-motion:reduce) { .registration-form-logo { animation:none; } }
.registration-form { display:block; width:100%; height:1200px; border:0; background:var(--white); }
.form-footer { text-align:center; padding:1.5rem 1rem 0; }
footer { text-align:center; color:var(--text-light); padding:1.5rem; border-top:1px solid rgba(139,69,19,.12); }
@media(max-width:600px) {
 .header-inner { padding:.8rem 1rem; }
 .brand-logo { height:50px; max-width:42vw; }
 .back-link { padding:.6rem .85rem; font-size:.82rem; white-space:nowrap; }
 main { padding:2rem 1rem 3rem; }
 .registration-form { height:1450px; }
}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html"><img class="brand-logo" src="lumi-logo.png" alt="Dr. Shifa's Lumi Skin and Hair Clinic"></a>
    <a class="back-link" href="index.html">← Back to Homepage</a>
  </div>
</header>
<main>
  <section class="intro" aria-labelledby="registration-title">
    <h1 id="registration-title">Patient Registration</h1>
    <p>Complete the form below to register with Dr. Shifa's Lumi Skin &amp; Hair Clinic.</p>
  </section>
  <img class="registration-form-logo" src="lumi-logo.png" alt="Lumi Skin &amp; Hair Clinic logo">
  <div class="form-card">
    <iframe class="registration-form" src="https://docs.google.com/forms/d/e/1FAIpQLSeI6wVvIYJHx1RwlweUcGFbBtvgSUNsh-oCYh-r3GkTsKUtAA/viewform?embedded=true" title="Lumi Clinic patient registration form" loading="eager">Loading registration form…</iframe>
  </div>
  <div class="form-footer">
    <a class="home-button" href="index.html">Return to Lumi Homepage</a>
  </div>
</main>
<footer>© 2026 Dr. Shifa's Lumi Skin &amp; Hair Clinic. All rights reserved.</footer>
</body>
</html>
